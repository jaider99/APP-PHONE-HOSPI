name: hospi_dash
description: Multi-tenant SaaS mobile app for hospitality businesses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend - Supabase
  supabase_flutter: ^2.12.4

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Biometric Authentication
  local_auth: ^2.3.0

  # Networking & Serialization
  dio: ^5.4.3+1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI Components
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Document Processing
  file_picker: ^8.1.2
  image: ^4.2.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  pdfx: ^2.6.0
  http: ^1.2.2
  http_parser: ^4.0.0

  # File System
  path_provider: ^2.1.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  logger: ^2.3.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

  # Linting
  flutter_lints: ^3.0.2

  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
